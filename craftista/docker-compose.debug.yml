# =====================================================================
# docker-compose.debug.yml — ТОЛЬКО для отладки на своей машине.
# Временно открывает порты бэкендов, чтобы заглянуть в их API/UI из браузера:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build
# Compose «накладывает» этот файл поверх основного и добавляет ports.
# =====================================================================
services:
  catalogue:
    ports:
      - "127.0.0.1:5000:5000"   # 127.0.0.1 — доступно только с вашей машины, не из сети
  recommendation:
    ports:
      - "127.0.0.1:8081:8080"
  voting:
    ports:
      - "127.0.0.1:8082:8080"
