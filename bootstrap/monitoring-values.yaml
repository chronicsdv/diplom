# kube-prometheus-stack: Prometheus + Grafana + Alertmanager + exporters

# Метрики control plane. etcd отдаёт метрики на отдельном порту 2381 (etcd_metrics_port в overrides.yml).
kubeEtcd:
  endpoints: [192.168.0.105]
  service:
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http
kubeProxy:
  enabled: true
kubeScheduler:
  endpoints: [192.168.0.105]
  service:
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true
kubeControllerManager:
  endpoints: [192.168.0.105]
  service:
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    insecureSkipVerify: true

prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 3GB
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # подхватывать ServiceMonitor/PodMonitor/правила из любых релизов (понадобится для Traefik и приложения)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  image:
    tag: "12.4.13"
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
  grafana.ini:
    dashboards:
      min_refresh_interval: 1m
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  defaultDashboardsTimezone: browser
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.craftista.local

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-telegram        # токен бота монтируется в Alertmanager как файл
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
            chat_id: ${TELEGRAM_CHAT_ID}
            send_resolved: true
