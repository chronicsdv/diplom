# HTTP-проверки сервисов Craftista (Probe для prometheus-operator, проверяет blackbox exporter изнутри кластера).
# Метка release: monitoring нужна, чтобы Prometheus из kube-prometheus-stack подхватил Probe.
---
# главная страница frontend
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: craftista-frontend
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: craftista
spec:
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://frontend.craftista.svc:3000/
      labels:
        probe_group: craftista
        service: frontend
---
# цепочка frontend -> catalogue -> PostgreSQL
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: craftista-products-chain
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: craftista
