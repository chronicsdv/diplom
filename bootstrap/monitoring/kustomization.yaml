# Дашборды Grafana (sidecar подхватывает ConfigMap с меткой grafana_dashboard=1), алерты и blackbox-проверки Prometheus.
# Применение:  kubectl apply --server-side -k bootstrap/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rules/craftista-alerts.yaml
  - probes/craftista-probes.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: craftista
configMapGenerator:
  - name: dashboard-craftista-app
    files: [dashboards/craftista-app.json]
  - name: dashboard-craftista-cluster
    files: [dashboards/craftista-cluster.json]
