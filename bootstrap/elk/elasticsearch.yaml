# Elasticsearch на одном узле (ECK). Heap 768 МБ, лимит памяти пода 1,5 ГБ.
# Требует vm.max_map_count=262144 на нодах (см. README и ansible/prepare.yml).
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logs
  namespace: logging
spec:
  version: 8.19.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.roles: ["master", "data", "ingest"]   # без ml: экономим память
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms768m -Xmx768m"
              resources:
                requests:
                  cpu: 250m
                  memory: 1536Mi
                limits:
                  memory: 1536Mi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: 8Gi
