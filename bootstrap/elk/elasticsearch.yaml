# Elasticsearch на одном узле (ECK). Heap 1 ГБ, лимит памяти пода 2 ГБ.
# Требует vm.max_map_count=262144 на нодах (см. README и ansible/prepare.yml).
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logs
  namespace: logging
spec:
  version: 8.19.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.roles: ["master", "data", "ingest"]   # без ml: экономим память
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms1g -Xmx1g"
              resources:
                requests:
                  cpu: 250m
                  memory: 2Gi
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: 8Gi
