# Grafana Alloy: собирает логи контейнеров с узлов и отправляет в Loki.
# DaemonSet читает файлы /var/log/pods на каждом воркере (рекомендуемая схема из документации Alloy).
# Собираются логи пространств craftista, argocd, traefik (список меняется в блоке namespaces ниже).
controller:
  type: daemonset

alloy:
  enableReporting: false
  mounts:
    varlog: true              # /var/log с узла (логи контейнеров containerd)
  securityContext:
    runAsUser: 0              # файлы логов читаются только от root
    runAsGroup: 0
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["craftista", "argocd", "traefik"]
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // путь к файлам логов этого пода на узле; на других узлах таких файлов нет, дублей не будет
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets       = discovery.relabel.pod_logs.output
        ignore_older_than  = "1h"
        sync_period        = "30s"
      }

      loki.source.file "pod_logs" {
        targets       = local.file_match.pod_logs.targets
        forward_to    = [loki.process.pod_logs.receiver]
        tail_from_end = true
      }

      loki.process "pod_logs" {
        stage.cri {}
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
