# CI: запускается при коммите в ЛЮБУЮ ветку.
# Этапы: линтеры и тесты -> сборка образов (артефакты) -> интеграционный тест -> публикация в ghcr.io -> тег в git (CD)
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- Проверка Dockerfile'ов ----------
  lint-dockerfiles:
    name: Lint Dockerfile (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, frontend, recommendation, voting]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: craftista/${{ matrix.service }}/Dockerfile
          failure-threshold: error

  # ---------- catalogue (Python / Flask) ----------
  catalogue:
    name: catalogue (lint + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: craftista/catalogue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: craftista/catalogue/requirements.txt
      - name: Установка зависимостей
        run: pip install -r requirements.txt flake8 pytest
      - name: Линтер (критичные ошибки - синтаксис, неопределённые имена)
        run: flake8 . --select=E9,F63,F7,F82 --show-source
      - name: Линтер (стиль, только предупреждения)
        run: flake8 . --max-line-length=120 --exit-zero --statistics
      - name: Тесты
        run: pytest -v test_app.py

  # ---------- frontend (Node.js) ----------
  frontend:
    name: frontend (lint + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: craftista/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Линтер (ESLint)
        run: npx --yes eslint@8 app.js routes test
      - name: Тесты (mocha)
        run: npm test

  # ---------- recommendation (Go) ----------
  recommendation:
    name: recommendation (lint + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: craftista/recommendation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: craftista/recommendation/go.sum
      - name: Форматирование (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы (запустите gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
      - name: Линтер (go vet)
        run: go vet ./...
      - name: Тесты
        run: go test ./... -v

  # ---------- voting (Java / Spring Boot) ----------
  voting:
    name: voting (build + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: craftista/voting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Сборка и тесты (Maven)
        run: mvn -B -ntp verify
      - name: Артефакт сборки (jar)
        uses: actions/upload-artifact@v4
        with:
          name: voting-jar
          path: craftista/voting/target/*.jar
          retention-days: 7
          if-no-files-found: warn

  # ---------- Сборка образов: результат сборки сохраняется как артефакт ----------
  # Образ собирается один раз и кладётся в артефакт (image-<сервис>). Дальше именно этот файл
  # проходит интеграционный тест и именно он публикуется в реестр.
  build:
    name: Сборка образа ${{ matrix.service }}
    runs-on: ubuntu-24.04
    needs: [lint-dockerfiles, catalogue, frontend, recommendation, voting]
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, frontend, recommendation, voting]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Метки образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/craftista-${{ matrix.service }}
      - name: Сборка образа в файл
        uses: docker/build-push-action@v6
        with:
          context: craftista/${{ matrix.service }}
          push: false
          # имя и тег как в craftista/docker-compose.yml: craftista/<сервис>:dev
          tags: craftista/${{ matrix.service }}:dev
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.service }}.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Артефакт сборки (образ)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/image-${{ matrix.service }}.tar
          retention-days: 1
          if-no-files-found: error

  # ---------- Интеграционный тест собранных образов (из артефактов) ----------
  # Берёт образы из артефактов сборки, поднимает все сервисы вместе через docker compose
  # и проверяет цепочку frontend -> catalogue / recommendation / voting (craftista/smoke-test.sh).
  # Отчёт теста сохраняется как артефакт integration-report.
  integration:
    name: Интеграционный тест (образы из артефактов + smoke-test)
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: craftista
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, что compose-файл и smoke-test на месте
        run: |
          test -f docker-compose.yml || { echo "Нет craftista/docker-compose.yml"; exit 1; }
          test -f smoke-test.sh || { echo "Нет craftista/smoke-test.sh"; exit 1; }
      - name: Скачать образы из артефактов сборки
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - name: Загрузить образы в Docker
        run: |
          for f in /tmp/images/image-*.tar; do docker load -i "$f"; done
          docker images 'craftista/*'
      - name: Файл .env для теста (пароль только для этого запуска)
        run: printf 'DB_PASSWORD=ci-test-password\n' > .env
      - name: Запуск всех сервисов (без сборки)
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Smoke-тест
        run: |
          set -o pipefail
          bash smoke-test.sh 2>&1 | tee smoke-test.log
      - name: Отчёт (статус и логи контейнеров)
        if: always()
        run: |
          docker compose ps -a > compose-ps.txt 2>&1 || true
          docker compose logs --no-color > compose-logs.txt 2>&1 || true
      - name: Артефакт отчёта интеграционного теста
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: |
            craftista/smoke-test.log
            craftista/compose-ps.txt
            craftista/compose-logs.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Остановка и очистка
        if: always()
        run: docker compose down -v

  # ---------- Инфраструктура и манифесты ----------
  helm:
    name: Helm-чарт (lint + template + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint
        run: helm lint helm/craftista --strict

      - name: Рендер со значениями по умолчанию + kubeconform
        run: |
          helm template craftista helm/craftista --namespace craftista \
            | docker run -i --rm ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -

      - name: Рендер с созданием секрета + kubeconform
        run: |
          helm template craftista helm/craftista --namespace craftista \
            --set database.createSecret=true \
            --set database.password=ci-test \
            | docker run -i --rm ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Формат
        run: terraform fmt -check -recursive
      - name: Фиктивный SSH-ключ (нужен только для validate, в облако не попадает)
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/craftista -q
      - name: Init без бэкенда
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  # ---------- Публикация образов, прошедших интеграционный тест ----------
  # Образы берутся из артефактов сборки (те же байты, что проходили тест) и пушатся в ghcr.io.
  publish:
    name: Публикация образа ${{ matrix.service }} -> ghcr.io
    runs-on: ubuntu-24.04
    needs: [integration]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, frontend, recommendation, voting]
    steps:
      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/craftista-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Скачать образ из артефакта сборки
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/image
      - name: Загрузить образ в Docker
        run: docker load -i /tmp/image/image-${{ matrix.service }}.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Теги и push (тот же образ, что прошёл тест)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SERVICE: ${{ matrix.service }}
        run: |
          while read -r t; do
            [ -n "$t" ] || continue
            docker tag "craftista/${SERVICE}:dev" "$t"
            docker push "$t"
          done <<< "$TAGS"

  # ---------- CD: прописываем новый тег образов в git, дальше работает Argo CD ----------
  # Ждёт публикацию образов, а она идёт только после успешного интеграционного теста.
  deploy:
    name: Обновление тега образов (GitOps)
    runs-on: ubuntu-24.04
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Прописать новый тег в values.yaml
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s/^(  imageTag: ).*/\1${TAG}/" helm/craftista/values.yaml
          grep -n "imageTag" helm/craftista/values.yaml
      - name: Коммит и push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "Тег не изменился"; exit 0; fi
          git add helm/craftista/values.yaml
          git commit -m "cd: deploy sha-${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  # ---------- Уведомление о результате в Telegram ----------
  notify:
    name: Уведомление в Telegram
    runs-on: ubuntu-24.04
    needs: [lint-dockerfiles, catalogue, frontend, recommendation, voting, build, integration, publish, helm, terraform, deploy]
    if: always()
    steps:
      - name: Отправить результат
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Секреты Telegram не заданы, пропускаю"; exit 0; fi
          if [ "$FAILED" = "true" ]; then ICON="❌"; STATUS="ОШИБКА"
          elif [ "$CANCELLED" = "true" ]; then ICON="⚠️"; STATUS="отменён"
          else ICON="✅"; STATUS="успешно"; fi
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT=$(printf '%s CI: %s\nВетка: %s\nКоммит: %s\nАвтор: %s\n%s' \
            "$ICON" "$STATUS" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$GITHUB_ACTOR" "$URL")
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" --data-urlencode text="$TEXT" >/dev/null
