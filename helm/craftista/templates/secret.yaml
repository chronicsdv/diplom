{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "craftista.dbSecretName" . }}
  labels:
    {{- include "craftista.labels" (dict "root" . "name" "catalogue-db") | nindent 4 }}
type: Opaque
stringData:
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ required "database.password обязателен, если database.createSecret=true" .Values.database.password | quote }}
{{- end }}
