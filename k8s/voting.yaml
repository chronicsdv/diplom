# Голоса хранятся в файловой H2-базе на томе, поэтому 1 реплика и стратегия Recreate
# (том ReadWriteOnce нельзя примонтировать к двум подам одновременно).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voting-data
  labels:
    app.kubernetes.io/name: voting
    app.kubernetes.io/part-of: craftista
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting
  labels:
    app.kubernetes.io/name: voting
    app.kubernetes.io/part-of: craftista
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: voting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voting
        app.kubernetes.io/part-of: craftista
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voting
          image: ghcr.io/chronicsdv/craftista-voting
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:h2:file:/data/votes     # файл БД на томе (в образе по умолчанию in-memory)
            - name: SPRING_H2_CONSOLE_ENABLED
              value: "false"
          startupProbe:                            # JVM + Spring стартуют долго
            httpGet: { path: /api/origamis, port: http }
            periodSeconds: 5
            failureThreshold: 36                   # до 3 минут на старт
          readinessProbe:
            httpGet: { path: /api/origamis, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/origamis, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: voting-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: voting
  labels:
    app.kubernetes.io/name: voting
    app.kubernetes.io/part-of: craftista
spec:
  selector:
    app.kubernetes.io/name: voting
  ports:
    - name: http
      port: 8080
      targetPort: http
