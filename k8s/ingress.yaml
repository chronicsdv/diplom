# Входная точка: Traefik слушает 80 порт на воркерах и отправляет всё во frontend.
# host не указан, поэтому открывается по IP любого воркера: http://<IP воркера>/
# Когда появится домен, добавьте сюда `host:` и секцию tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: craftista
  labels:
    app.kubernetes.io/part-of: craftista
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
