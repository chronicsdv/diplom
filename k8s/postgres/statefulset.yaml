apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalogue-db
  labels:
    app.kubernetes.io/name: catalogue-db
    app.kubernetes.io/part-of: craftista
spec:
  serviceName: catalogue-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogue-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogue-db
        app.kubernetes.io/part-of: craftista
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # пользователь postgres в alpine-образе
        runAsGroup: 70
        fsGroup: 70            # том будет доступен на запись этому пользователю
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: craftista-db, key: DB_NAME } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: craftista-db, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: craftista-db, key: DB_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d   # выполняется при первом запуске с пустым томом
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init
          configMap:
            name: catalogue-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
