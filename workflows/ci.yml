# CI: запускается при коммите в ЛЮБУЮ ветку.
# Этапы: линтеры -> тесты -> сборка образов -> загрузка образов в ghcr.io
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- Проверка Dockerfile'ов ----------
  lint-dockerfiles:
    name: Lint Dockerfile (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, frontend, recommendation, voting]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: craftista/${{ matrix.service }}/Dockerfile
          failure-threshold: error

  # ---------- catalogue (Python / Flask) ----------
  catalogue:
    name: catalogue (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craftista/catalogue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: craftista/catalogue/requirements.txt
      - name: Установка зависимостей
        run: pip install -r requirements.txt flake8 pytest
      - name: Линтер (критичные ошибки - синтаксис, неопределённые имена)
        run: flake8 . --select=E9,F63,F7,F82 --show-source
      - name: Линтер (стиль, только предупреждения)
        run: flake8 . --max-line-length=120 --exit-zero --statistics
      - name: Тесты
        run: pytest -v test_app.py

  # ---------- frontend (Node.js) ----------
  frontend:
    name: frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craftista/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Линтер (ESLint)
        run: npx --yes eslint@8 app.js routes test
      - name: Тесты (mocha)
        run: npm test

  # ---------- recommendation (Go) ----------
  recommendation:
    name: recommendation (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craftista/recommendation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: craftista/recommendation/go.sum
      - name: Форматирование (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы (запустите gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
      - name: Линтер (go vet)
        run: go vet ./...
      - name: Тесты
        run: go test ./... -v

  # ---------- voting (Java / Spring Boot) ----------
  voting:
    name: voting (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craftista/voting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Сборка и тесты (Maven)
        run: mvn -B -ntp verify

  # ---------- Инфраструктура и манифесты ----------
  manifests:
    name: Kubernetes-манифесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Валидация (kustomize + kubeconform)
        run: |
          kubectl kustomize k8s \
            | docker run -i --rm ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Формат
        run: terraform fmt -check -recursive
      - name: Фиктивный SSH-ключ (нужен только для validate, в облако не попадает)
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/craftista -q
      - name: Init без бэкенда
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  # ---------- Сборка и загрузка образов ----------
  build-and-push:
    name: Образ ${{ matrix.service }} -> ghcr.io
    runs-on: ubuntu-latest
    needs: [lint-dockerfiles, catalogue, frontend, recommendation, voting]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, frontend, recommendation, voting]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Теги и метки образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/craftista-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Сборка и push
        uses: docker/build-push-action@v6
        with:
          context: craftista/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
