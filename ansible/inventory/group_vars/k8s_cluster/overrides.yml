---
# Наши переопределения для Kubespray. Всё остальное — значения по умолчанию.

# Сетевой плагин (в Kubespray по умолчанию и так calico, указано явно для наглядности)
kube_network_plugin: calico

# Забрать admin.conf на локальную машину: ansible/inventory/artifacts/admin.conf
kubeconfig_localhost: true
kubectl_localhost: false


etcd_metrics_port: 2381
kube_proxy_metrics_bind_address: 0.0.0.0:10249
